<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS — Voice &amp; Chat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23FF1800' opacity='0.3'/><circle cx='16' cy='16' r='10' fill='none' stroke='%23FFFF00' stroke-width='2'/><circle cx='16' cy='16' r='4' fill='%23FF1C00'/></svg>" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Modern UI v2.0 - Enhanced Iron Man Theme with Glassmorphism -->
  <style>
    :root {
      --bg-deep: #000000;
      --bg-panel: #0f0f15;
      --bg-input: #1a1a22;
      --border: #2a2a35;
      /* Yellow */
      --gold: #FFFF00;
      --gold-bright: #FFD700;
      --gold-glow: #FFED4E;
      --gold-dim: #FFD700;
      /* Hot Rod Red */
      --iron-red: #FF1800;
      --iron-red-bright: #FF1C00;
      --iron-red-glow: #FF2000;
      --iron-red-dim: #CC1400;
      /* Accent Colors */
      --red: #FF1800;
      --text: #F5F5F5;
      --text-muted: #B0B0B0;
      --user-msg-bg: rgba(255, 24, 0, 0.15);
      --assistant-msg-bg: rgba(255, 255, 0, 0.12);
      --radius: 20px;
      --radius-sm: 12px;
      /* Modern easing functions - Professional patterns from bOoKs On Ui.md */
      --ease-out: cubic-bezier(0, 0, 0.58, 1);
      --ease-in-out: cubic-bezier(0.42, 0, 0.58, 1);
      --ease-in: cubic-bezier(0.42, 0, 1, 1);
      --ease-sharp: cubic-bezier(0.4, 0, 0.6, 1);
      --ease-elastic: cubic-bezier(0.68, -0.55, 0.265, 1.55);
      --ease-material: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-deceleration: cubic-bezier(0, 0, 0.2, 1);
      --ease-acceleration: cubic-bezier(0.4, 0, 1, 1);
      /* Timing durations - from reference document */
      --timing-instant: 100ms;
      --timing-quick: 200ms;
      --timing-fast: 300ms;
      --timing-normal: 500ms;
      --timing-slow: 800ms;
      --timing-dramatic: 1200ms;
    }
    * { 
      box-sizing: border-box;
    }
    body {
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
      font-variant-numeric: oldstyle-nums;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      background: var(--bg-deep);
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 24, 0, 0.2) 0%, transparent 60%),
        radial-gradient(circle at 80% 70%, rgba(255, 255, 0, 0.25) 0%, transparent 60%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 0, 0.15) 0%, transparent 70%),
        linear-gradient(135deg, rgba(255, 24, 0, 0.12) 0%, rgba(255, 255, 0, 0.1) 50%, rgba(255, 24, 0, 0.08) 100%);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 24, 0, 0.05) 2px, rgba(255, 24, 0, 0.05) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255, 255, 0, 0.05) 2px, rgba(255, 255, 0, 0.05) 4px),
        repeating-linear-gradient(45deg, transparent, transparent 1px, rgba(255, 255, 0, 0.03) 1px, rgba(255, 255, 0, 0.03) 2px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 30% 40%, rgba(255, 24, 0, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 60%, rgba(255, 255, 0, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(255, 255, 0, 0.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
      animation: backgroundPulse 8s ease-in-out infinite;
    }
    @keyframes backgroundPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.7; }
    }
    .chat-interface {
      width: min(700px, calc(100vw - 2rem));
      height: min(600px, calc(100vh - 2rem));
      height: min(600px, calc(100dvh - 2rem));
      max-width: 100%;
      max-height: 100%;
      min-width: 280px;
      min-height: 320px;
      margin: 1rem;
      display: flex;
      flex-direction: column;
      background: rgba(15, 15, 21, 0.7);
      background-image: 
        linear-gradient(135deg, rgba(255, 24, 0, 0.15) 0%, rgba(255, 255, 0, 0.12) 50%, rgba(255, 24, 0, 0.1) 100%),
        radial-gradient(circle at top left, rgba(255, 24, 0, 0.2) 0%, transparent 50%),
        radial-gradient(circle at bottom right, rgba(255, 255, 0, 0.18) 0%, transparent 50%);
      border: none;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 
        0 25px 70px rgba(0, 0, 0, 0.8),
        0 0 0 2px rgba(255, 24, 0, 0.3),
        0 0 80px rgba(255, 24, 0, 0.3),
        0 0 120px rgba(255, 255, 0, 0.2),
        0 0 100px rgba(255, 24, 0, 0.15),
        inset 0 2px 4px rgba(255, 255, 255, 0.12),
        inset 0 -2px 4px rgba(255, 255, 0, 0.15);
      backdrop-filter: blur(25px) saturate(200%);
      -webkit-backdrop-filter: blur(25px) saturate(200%);
      position: relative;
      z-index: 1;
    }
    .chat-interface::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      padding: 3px;
      background: rgba(255, 255, 0, 0.3);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: -1;
    }
    .chat-interface::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255, 255, 0, 0.3);
      pointer-events: none;
      box-shadow: 
        0 0 10px rgba(255, 255, 0, 0.2);
    }
    .header {
      flex-shrink: 0;
      padding: 1rem 1.5rem;
      border-bottom: 2px solid;
      border-image: linear-gradient(90deg, transparent, var(--iron-red), var(--gold), var(--iron-red-bright), var(--gold), var(--iron-red), transparent) 1;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(15, 15, 21, 0.6);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      position: relative;
      box-shadow: 
        0 4px 16px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 0 30px rgba(255, 24, 0, 0.2),
        0 0 20px rgba(255, 255, 0, 0.15);
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, 
        transparent, 
        var(--iron-red) 20%, 
        var(--gold) 40%, 
        var(--iron-red-bright) 50%, 
        var(--gold) 60%, 
        var(--iron-red) 80%, 
        transparent
      );
      box-shadow: 
        0 0 20px var(--iron-red), 
        0 0 35px var(--gold);
      animation: borderGlow 3s ease-in-out infinite;
    }
    @keyframes borderGlow {
      0%, 100% { 
        opacity: 0.8;
        box-shadow: 
          0 0 20px var(--iron-red), 
          0 0 35px var(--gold);
      }
      50% { 
        opacity: 1;
        box-shadow: 
          0 0 30px var(--iron-red), 
          0 0 50px var(--gold),
          0 0 40px var(--iron-red-bright);
      }
    }
    .header .logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--iron-red-bright), var(--gold-bright), var(--iron-red), var(--gold));
      box-shadow: 
        0 0 40px rgba(255, 24, 0, 0.9),
        0 0 80px rgba(255, 24, 0, 0.6),
        0 0 120px rgba(255, 255, 0, 0.5),
        0 0 100px rgba(255, 255, 0, 0.4),
        inset 0 0 30px rgba(255, 255, 0, 0.6),
        inset 0 0 50px rgba(255, 24, 0, 0.4);
      position: relative;
      transition: transform var(--ease-material) 300ms, box-shadow var(--ease-material) 300ms;
      border: 2px solid rgba(255, 255, 0, 0.5);
    }
    .header .logo::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--iron-red), var(--gold), var(--iron-red-bright), var(--gold), var(--iron-red));
      opacity: 0.5;
      animation: logoRotate 3s linear infinite;
      z-index: -1;
    }
    @keyframes logoRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .header .logo {
        animation: logoGlow 2s ease-in-out infinite;
      }
    }
    @keyframes logoGlow {
      0%, 100% { 
        box-shadow: 
          0 0 40px rgba(255, 24, 0, 0.9),
          0 0 80px rgba(255, 24, 0, 0.6),
          0 0 120px rgba(255, 255, 0, 0.5),
          0 0 100px rgba(255, 255, 0, 0.4),
          inset 0 0 30px rgba(255, 255, 0, 0.6);
        transform: scale(1);
      }
      50% { 
        box-shadow: 
          0 0 70px rgba(255, 24, 0, 1),
          0 0 140px rgba(255, 24, 0, 0.8),
          0 0 200px rgba(255, 255, 0, 0.7),
          0 0 160px rgba(255, 255, 0, 0.6),
          inset 0 0 40px rgba(255, 255, 0, 0.8),
          inset 0 0 25px rgba(255, 24, 0, 0.5);
        transform: scale(1.08);
      }
    }
    .header h1 {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      margin: 0;
      letter-spacing: 0.03em;
      font-feature-settings: 'liga', 'kern';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 30%, var(--iron-red) 50%, var(--gold) 70%, var(--gold-bright) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: 
        drop-shadow(0 0 20px rgba(255, 255, 0, 0.9)) 
        drop-shadow(0 0 30px rgba(255, 24, 0, 0.8));
      animation: textShimmer 2.5s ease-in-out infinite;
      text-transform: uppercase;
      position: relative;
    }
    .header h1::before {
      content: 'JARVIS';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--iron-red-bright) 0%, var(--iron-red) 30%, var(--gold) 50%, var(--iron-red) 70%, var(--gold-bright) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      animation: textShimmerAlt 2.5s ease-in-out infinite;
    }
    @keyframes textShimmer {
      0%, 100% { 
        filter: 
          drop-shadow(0 0 20px rgba(255, 255, 0, 0.9)) 
          drop-shadow(0 0 30px rgba(255, 24, 0, 0.8));
        background-position: 0% 50%;
      }
      50% { 
        filter: 
          drop-shadow(0 0 28px rgba(255, 255, 0, 1)) 
          drop-shadow(0 0 45px rgba(255, 24, 0, 1))
          drop-shadow(0 0 60px rgba(255, 255, 0, 0.6));
        background-position: 100% 50%;
      }
    }
    @keyframes textShimmerAlt {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.3; }
    }
    .header .status {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text-muted);
      margin-left: auto;
      padding: 0.25rem 0.75rem;
      border-radius: 6px;
      font-feature-settings: 'liga', 'kern';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: rgba(42, 52, 65, 0.6);
      border: 1px solid rgba(255, 24, 0, 0.3);
      transition: all var(--ease-material) 300ms;
      position: relative;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      user-select: none;
    }
    .header .status:hover {
      background: rgba(42, 52, 65, 0.8);
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(255, 255, 0, 0.3);
      transform: scale(1.05);
    }
    .header .status:active {
      transform: scale(0.98);
    }
    .header .status::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.6;
      margin-left: -14px;
      transition: opacity var(--ease-material) 300ms;
      box-shadow: 0 0 8px currentColor;
    }
    .header .status.listening { 
      color: var(--iron-red-bright);
      background: rgba(255, 24, 0, 0.2);
      border-color: var(--iron-red);
      box-shadow: 
        0 0 30px rgba(255, 24, 0, 0.6),
        0 0 60px rgba(255, 24, 0, 0.4),
        inset 0 0 15px rgba(255, 24, 0, 0.2);
    }
    .header .status.listening::before {
      opacity: 1;
      background: var(--iron-red-bright);
      box-shadow: 
        0 0 18px var(--iron-red),
        0 0 36px var(--iron-red),
        0 0 54px var(--iron-red);
      animation: statusPulse 1.2s var(--ease-in-out) infinite;
    }
    .header .status.speaking { 
      color: var(--gold-bright);
      background: rgba(255, 255, 0, 0.18);
      border-color: var(--gold);
      box-shadow: 
        0 0 25px rgba(255, 255, 0, 0.5),
        0 0 50px rgba(255, 255, 0, 0.3),
        0 0 30px rgba(255, 24, 0, 0.2),
        inset 0 0 12px rgba(255, 255, 0, 0.15);
    }
    .header .status.speaking::before {
      opacity: 1;
      background: var(--gold-bright);
      box-shadow: 
        0 0 15px var(--gold),
        0 0 30px var(--gold),
        0 0 45px var(--gold),
        0 0 20px var(--iron-red);
      animation: statusPulse 1.2s var(--ease-in-out) infinite;
    }
    .header .status.status-misfire { 
      color: var(--gold-dim);
      background: rgba(139, 115, 85, 0.1);
    }
    .header .status.error { 
      color: var(--red);
      background: rgba(230, 57, 70, 0.1);
      box-shadow: 0 0 12px rgba(230, 57, 70, 0.2);
    }
    .header .status.error::before {
      opacity: 1;
    }
    @keyframes statusPulse {
      0%, 100% { opacity: 0.6; transform: translateY(-50%) scale(1); }
      50% { opacity: 1; transform: translateY(-50%) scale(1.2); }
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      margin-left: 0.5rem;
    }
    .header-actions .btn-icon {
      width: 40px;
      height: 40px;
    }

    .chat-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 1rem 1.5rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      scroll-behavior: smooth;
    }
    .chat-container::-webkit-scrollbar {
      width: 6px;
    }
    .chat-container::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-container::-webkit-scrollbar-thumb {
      background: rgba(139, 115, 85, 0.3);
      border-radius: 3px;
      transition: background var(--ease-material) 200ms;
    }
    .chat-container::-webkit-scrollbar-thumb:hover {
      background: rgba(201, 162, 39, 0.5);
    }
    .message {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 1.125rem;
      line-height: 1.6;
      position: relative;
      font-feature-settings: 'liga', 'kern';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      backdrop-filter: blur(16px) saturate(150%);
      -webkit-backdrop-filter: blur(16px) saturate(150%);
    }
    @media (prefers-reduced-motion: no-preference) {
      .message { 
        animation: fadeIn var(--timing-fast) var(--ease-out);
      }
    }
    @keyframes fadeIn {
      from { 
        opacity: 0; 
        transform: translateY(8px) scale(0.98);
      }
      to { 
        opacity: 1; 
        transform: translateY(0) scale(1);
      }
    }
    /* Enhanced microinteractions - Button press feedback */
    .btn-icon:active:not(:disabled),
    .btn-send:active:not(:disabled) {
      transition: transform var(--timing-instant) var(--ease-sharp);
    }
    /* Smooth status transitions */
    .header .status {
      transition: all var(--timing-fast) var(--ease-material);
    }
    /* Input focus microinteraction */
    .input-wrap:focus-within {
      transition: all var(--timing-quick) var(--ease-out);
    }
    /* Progress indicator styles */
    .progress-indicator-wrapper {
      position: relative;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin: 0.5rem 0;
    }
    .progress-indicator-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: var(--gold);
      transition: width var(--timing-fast) var(--ease-out);
      box-shadow: 0 0 10px var(--gold);
    }
    @keyframes spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    .progress-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      border: 2px solid var(--gold);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 20000ms linear infinite;
    }
    /* Autocomplete dropdown */
    .autocomplete-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: rgba(15, 15, 21, 0.98);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-top: 4px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .autocomplete-item {
      padding: 0.75rem 1rem;
      cursor: pointer;
      transition: background var(--timing-instant) var(--ease-out);
    }
    .autocomplete-item:hover,
    .autocomplete-item.selected {
      background: rgba(255, 255, 0, 0.2);
    }
    /* Input hint styles */
    .input-hint {
      position: absolute;
      bottom: -24px;
      left: 0;
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity var(--timing-quick) var(--ease-out);
      pointer-events: none;
    }
    /* Notification styles */
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 1rem 1.5rem;
      background: rgba(15, 15, 21, 0.95);
      border: 2px solid;
      border-radius: 12px;
      color: var(--text);
      font-size: 0.9375rem;
      z-index: 10000;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      transform: translateX(400px);
      opacity: 0;
      transition: transform var(--timing-fast) var(--ease-out), opacity var(--timing-fast) var(--ease-out);
      max-width: 400px;
      word-wrap: break-word;
    }
    .notification.show {
      transform: translateX(0);
      opacity: 1;
    }
    /* Enhanced message animations */
    .message.typing {
      opacity: 0.7;
    }
    .message.typing::after {
      content: '...';
      animation: typingDots 1.4s steps(4, end) infinite;
    }
    @keyframes typingDots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }
    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(255, 24, 0, 0.25), rgba(255, 24, 0, 0.15));
      border: 1.5px solid var(--iron-red);
      box-shadow: 
        0 4px 14px rgba(255, 24, 0, 0.3),
        0 0 30px rgba(255, 24, 0, 0.25),
        inset 0 1px 0 rgba(220, 20, 60, 0.3);
    }
    .message.assistant {
      align-self: flex-start;
      background: linear-gradient(135deg, rgba(255, 255, 0, 0.2), rgba(255, 255, 0, 0.1), rgba(255, 24, 0, 0.08));
      border: 1.5px solid var(--gold);
      box-shadow: 
        0 4px 14px rgba(255, 255, 0, 0.25),
        0 0 25px rgba(255, 255, 0, 0.2),
        0 0 15px rgba(255, 24, 0, 0.15),
        inset 0 1px 0 rgba(255, 215, 0, 0.25);
    }
    .message .label {
      font-size: 0.9375rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
      font-weight: 600;
      font-feature-settings: 'liga', 'kern';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .message.assistant .label { 
      color: var(--gold-dim);
      text-shadow: 0 0 8px rgba(201, 162, 39, 0.3);
    }
    .message.user .label {

<body>

  <script>
    window.JARVIS_CONFIG = window.JARVIS_CONFIG || {};
    // Cartesia API Configuration - MUST be set via environment variables or window.JARVIS_CONFIG
    // Never hardcode API keys in source code - this is a critical security vulnerability
    // API keys should be injected at build time via Vite environment variables
    // For static HTML, set window.JARVIS_CONFIG.apiKey before this script runs
    window.JARVIS_CONFIG.apiKey = window.JARVIS_CONFIG.apiKey || '';
    window.JARVIS_CONFIG.voiceId = window.JARVIS_CONFIG.voiceId || '95131c95-525c-463b-893d-803bafdf93c4';
    
    // Enable debug: ?debug=1 in URL, or set window.JARVIS_DEBUG = true
    if (/[?&]debug=1/.test(location.search) || /[?&]debug=true/.test(location.search)) {
      window.JARVIS_DEBUG = true;
    }

    // Console error + warning capture (errors and warnings)
    (function() {
      'use strict';
      
      const maxEntries = 2000;
      window.__JARVIS_CAPTURED_LOGS = window.__JARVIS_CAPTURED_LOGS || [];
      const capturedLogs = window.__JARVIS_CAPTURED_LOGS;
      const captured = capturedLogs;
      
      // Track captured entries to avoid duplicates
      const capturedEntrySet = new Set();
      
      // Helper to format timestamp
      function formatTimestamp() {
        const now = new Date();
        return now.toLocaleTimeString('en-US', { 
          hour12: false, 
          hour: '2-digit', 
          minute: '2-digit', 
          second: '2-digit',
          fractionalSecondDigits: 3
        });
      }
      
      // Helper to stringify objects
      function stringifyArg(arg) {
        if (arg === null) return 'null';
        if (arg === undefined) return 'undefined';
        if (typeof arg === 'string') return arg;
        if (typeof arg === 'object') {
          try {
            // Check if it's an Error object
            if (arg instanceof Error) {
              let errorStr = `Error: ${arg.name || 'Error'}\nMessage: ${arg.message || '(no message)'}`;
              if (arg.stack) {
                errorStr += `\nStack:\n${arg.stack}`;
              }
              if (arg.cause) {
                errorStr += `\nCause: ${stringifyArg(arg.cause)}`;
              }
              return errorStr;
            }
            // Check if it's an n8n diagnostic object
            if (arg.issue || arg.issueDescription || arg.diagnostics || arg.diagnosticSteps || 
                arg.webhookUrl || arg.dataKeys || (arg.status && (arg.issue || arg.diagnostics))) {
              return '\n[n8n Configuration Diagnostic]\n' + JSON.stringify(arg, null, 2);
            }
            return JSON.stringify(arg, null, 2);
          } catch (e) {
            return String(arg);
          }
        }
        return String(arg);
      }
      
      // Helper to format log entry with better handling of multiple arguments
      function formatLogEntry(level, args) {
        const timestamp = formatTimestamp();
        if (args.length === 0) {
          return `[${timestamp}] ${level}\n(no message)`;
        }
        // Use newlines for better readability when multiple arguments
        const message = Array.from(args).map(stringifyArg).join('\n');
        return `[${timestamp}] ${level}\n${message}`;
      }
      
      // Helper to capture log entry (with duplicate prevention)
      function captureLogEntry(entry) {
        // Create a hash based on content (first 200 chars) to detect exact duplicates
        // Only prevent duplicates if they're identical and within 100ms (to prevent spam)
        const contentHash = entry.substring(0, 200);
        const timeWindow = Math.floor(Date.now() / 100); // 100ms windows
        const entryHash = contentHash + '|' + timeWindow;
        
        if (!capturedEntrySet.has(entryHash)) {
          capturedEntrySet.add(entryHash);
          capturedLogs.push(entry);
          if (captured.length > maxEntries) {
            capturedLogs.splice(0, capturedLogs.length - maxEntries);
          }
          updateLogCount();
          // Clean up old hashes periodically (keep last 2000)
          if (capturedEntrySet.size > 2000) {
            const entries = Array.from(capturedEntrySet);
            entries.slice(0, entries.length - 1000).forEach(hash => capturedEntrySet.delete(hash));
          }
        }
      }
      
      // Intercept console.error
      const originalError = console.error;
      console.error = function(...args) {
        originalError.apply(console, args);
        const entry = formatLogEntry('ERROR', args);
        captureLogEntry(entry);
      };
      
      // Intercept console.warn
      const originalWarn = console.warn;
      console.warn = function(...args) {
        originalWarn.apply(console, args);
        const entry = formatLogEntry('WARN', args);
        captureLogEntry(entry);
        
        // Special handling for n8n warnings
        if (args.length > 0 && typeof args[0] === 'string' && 
            (args[0].includes('[JARVIS]') || args[0].includes('n8n') || args[0].includes('webhook'))) {
          if (args.length > 1 && typeof args[1] === 'object') {
            const diagnostic = stringifyArg(args[1]);
            const diagnosticEntry = `[${formatTimestamp()}] WARN\n[n8n Diagnostic Details]\n${diagnostic}`;
            captureLogEntry(diagnosticEntry);
          }
        }
      };
      
      // Intercept console.log for JARVIS messages
      const originalLog = console.log;
      console.log = function(...args) {
        originalLog.apply(console, args);
        // Only capture JARVIS-related logs
        if (args.length > 0 && typeof args[0] === 'string' && 
            (args[0].includes('[JARVIS]') || args[0].includes('n8n') || args[0].includes('webhook'))) {
          const entry = formatLogEntry('LOG', args);
          captureLogEntry(entry);
        }
      };
      
      // Capture unhandled promise rejections
      window.addEventListener('unhandledrejection', function(event) {
        const timestamp = formatTimestamp();
        let errorInfo = `[${timestamp}] UNHANDLED PROMISE REJECTION\n`;
        
        if (event.reason instanceof Error) {
          errorInfo += `Error: ${event.reason.name || 'Error'}\n`;
          errorInfo += `Message: ${event.reason.message || '(no message)'}\n`;
          if (event.reason.stack) {
            errorInfo += `Stack:\n${event.reason.stack}`;
          }
        } else if (typeof event.reason === 'object' && event.reason !== null) {
          errorInfo += `Reason: ${JSON.stringify(event.reason, null, 2)}`;
        } else {
          errorInfo += `Reason: ${String(event.reason)}`;
        }
        
        captureLogEntry(errorInfo);
        // Also log to console for visibility
        originalError('[JARVIS] Unhandled Promise Rejection:', event.reason);
      });
      
      // Capture uncaught exceptions
      window.addEventListener('error', function(event) {
        const timestamp = formatTimestamp();
        let errorInfo = `[${timestamp}] UNCAUGHT EXCEPTION\n`;
        errorInfo += `Message: ${event.message || '(no message)'}\n`;
        errorInfo += `Source: ${event.filename || 'unknown'}:${event.lineno || '?'}:${event.colno || '?'}\n`;
        if (event.error) {
          if (event.error instanceof Error) {
            errorInfo += `Error: ${event.error.name || 'Error'}\n`;
            if (event.error.stack) {
              errorInfo += `Stack:\n${event.error.stack}`;
            }
          } else {
            errorInfo += `Error: ${stringifyArg(event.error)}`;
          }
        }
        
        captureLogEntry(errorInfo);
        // Don't prevent default - let browser handle it normally
      });
      
      // Capture console.assert failures
      const originalAssert = console.assert;
      console.assert = function(condition, ...args) {
        if (!condition) {
          originalAssert.apply(console, [condition, ...args]);
          const entry = formatLogEntry('ASSERT FAILED', args.length > 0 ? args : ['Assertion failed']);
          captureLogEntry(entry);
        } else {
          originalAssert.apply(console, [condition, ...args]);
        }
      };
      
      // Update log count badge
      function updateLogCount() {
        const countEl = document.getElementById('logCount');
        if (countEl) {
          const count = capturedLogs.length;
          if (count > 0) {
            countEl.textContent = count > 99 ? '99+' : count;
            countEl.style.display = 'block';
          } else {
            countEl.style.display = 'none';
          }
        }
      }
      
      // Copy logs to clipboard
      function copyLogs() {
        if (capturedLogs.length === 0) {
          alert('No logs captured yet. Errors and warnings will appear here automatically.');
          return;
        }
        
        const header = '═══════════════════════════════════════════════════════════\n';
        const title = 'JARVIS Error & Warning Log\n';
        const timestamp = `Captured: ${new Date().toLocaleString()}\n`;
        const separator = '═══════════════════════════════════════════════════════════\n\n';
        
        const fullLog = header + title + timestamp + separator + 
                       capturedLogs.join('\n\n' + '─'.repeat(60) + '\n\n') + 
                       '\n\n' + separator;
        
        navigator.clipboard.writeText(fullLog).then(() => {
          const btn = document.getElementById('btnCopyLog');
          if (btn) {
            // Clear any existing timeout
            if (btn._copyLogTimeout) {
              clearTimeout(btn._copyLogTimeout);
              btn._copyLogTimeout = null;
            }
            // Always reset to "Copy error logs" (not the current title which might be "Copied!")
            const originalTitle = 'Copy error logs';
            btn.title = 'Copied!';
            btn._copyLogTimeout = setTimeout(() => {
              btn.title = originalTitle;
              btn._copyLogTimeout = null;
            }, 2000);
          }
          console.log(`✅ Copied ${capturedLogs.length} log entries to clipboard`);
        }).catch(err => {
          console.error('Failed to copy logs:', err);
          alert('Failed to copy logs. Please check console for errors.');
        });
      }
      
      // Initialize button when DOM is ready
      function initCopyLogButton() {
        const btn = document.getElementById('btnCopyLog');
        if (btn) {
          btn.addEventListener('click', copyLogs);
          updateLogCount();
        } else {
          // Retry if button not found yet
          setTimeout(initCopyLogButton, 100);
        }
      }
      
      // Start initialization
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initCopyLogButton);
      } else {
        initCopyLogButton();
      }
      
      // Expose function for manual testing
      window.JARVIS_COPY_LOGS = copyLogs;
      window.JARVIS_GET_LOGS = () => capturedLogs;
      window.JARVIS_CLEAR_LOGS = () => {
        capturedLogs.length = 0;
        capturedEntrySet.clear();
        updateLogCount();
      };
      
      console.log('[JARVIS] Error log capture initialized');
    })();

    // Ready Button Functionality
    (function() {
      'use strict';
      
      function initReadyButton() {
        const statusEl = document.getElementById('status');
        if (!statusEl) {
          setTimeout(initReadyButton, 100);
          return;
        }
        
        // Add title/aria-label to indicate it's clickable
        statusEl.setAttribute('role', 'button');
        statusEl.setAttribute('tabindex', '0');
        statusEl.setAttribute('title', 'Click to reset to Ready state');
        statusEl.setAttribute('aria-label', 'Status indicator - click to reset to Ready');
        
        function resetToReady() {
          // Reset status text and classes
          statusEl.textContent = 'Ready';
          statusEl.className = 'status';
          
          // Stop any active STT/TTS if bridge is available
          if (window.JARVIS_BRIDGE) {
            try {
              if (window.JARVIS_BRIDGE.isSTTActive && window.JARVIS_BRIDGE.isSTTActive()) {
                window.JARVIS_BRIDGE.stopSTT();
              }
              if (window.JARVIS_BRIDGE.stopTTS) {
                window.JARVIS_BRIDGE.stopTTS();
              }
            } catch (err) {
              console.warn('[JARVIS] Error stopping bridge operations:', err);
            }
          }
          
          // Reset mic button if it exists
          const btnMic = document.getElementById('btnMic');
          if (btnMic) {
            btnMic.classList.remove('active', 'recording');
            btnMic.setAttribute('aria-pressed', 'false');
            btnMic.disabled = false;
            const micLabel = btnMic.getAttribute('aria-label');
            if (micLabel && !micLabel.includes('Microphone — click to talk')) {
              btnMic.setAttribute('aria-label', 'Microphone — click to talk');
            }
          }
          
          // Reset copy error logs button
          const btnCopyLog = document.getElementById('btnCopyLog');
          if (btnCopyLog) {
            // Clear any pending timeout that would reset the title
            if (btnCopyLog._copyLogTimeout) {
              clearTimeout(btnCopyLog._copyLogTimeout);
              btnCopyLog._copyLogTimeout = null;
            }
            btnCopyLog.title = 'Copy error logs';
            // Clear captured logs if the function is available
            if (window.JARVIS_CLEAR_LOGS) {
              window.JARVIS_CLEAR_LOGS();
            }
          }
          
          console.log('[JARVIS] Reset to Ready state');
        }
        
        // Click handler
        statusEl.addEventListener('click', resetToReady);
        
        // Keyboard handler (Enter/Space)
        statusEl.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            resetToReady();
          }
        });
      }
      
      // Initialize when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initReadyButton);
      } else {
        initReadyButton();
      }
    })();
  </script>
  <script type="module" src="./js/app.js"></script>
  <script>
    // Set timestamp on initial message and update greeting with time of day
    (function() {
      function getTimeOfDay() {
        const hour = new Date().getHours();
        if (hour >= 5 && hour < 12) return 'morning';
        if (hour >= 12 && hour < 17) return 'afternoon';
        // Evening: 5:00 PM - 4:59 AM (hours 17-4)
        return 'evening';
      }

      function setInitialTimestamp() {
        const initialTimestamp = document.getElementById('initialTimestamp');
        if (initialTimestamp) {
          const now = new Date();
          const timestamp = now.toLocaleTimeString('en-US', { 
            hour12: true, 
            hour: 'numeric', 
            minute: '2-digit'
          });
          initialTimestamp.textContent = timestamp;
        }
      }

      function setInitialGreeting() {
        const initialGreeting = document.getElementById('initialGreeting');
        if (initialGreeting) {
          const timeOfDay = getTimeOfDay();
          initialGreeting.textContent = initialGreeting.textContent.replace('{{ now }}', timeOfDay);
        }
      }

      function initialize() {
        setInitialTimestamp();
        setInitialGreeting();
      }
      
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initialize);
      } else {
        initialize();
      }
    })();
  </script>
