<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS — Voice &amp; Chat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%2300d4ff' opacity='0.2'/><circle cx='16' cy='16' r='10' fill='none' stroke='%23c9a227' stroke-width='2'/><circle cx='16' cy='16' r='4' fill='%2300d4ff'/></svg>" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #060a0f;
      --bg-panel: #0d1117;
      --bg-input: #161b22;
      --border: #21262d;
      --gold: #c9a227;
      --gold-dim: #8b7355;
      --red: #e63946;
      --arc-blue: #00d4ff;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --user-msg-bg: rgba(0, 212, 255, 0.08);
      --assistant-msg-bg: rgba(201, 162, 39, 0.06);
      --radius: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-interface {
      width: 600px;
      height: 500px;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .header {
      flex-shrink: 0;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--bg-panel);
    }
    .header .logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--arc-blue), var(--gold));
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }
    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, var(--gold), var(--arc-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header .status {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: auto;
    }
    .header .status.listening { color: var(--arc-blue); }
    .header .status.speaking { color: var(--gold); }
    .header .status.status-misfire { color: var(--gold-dim); }
    .header .status.error { color: var(--red); }

    .chat-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 1rem 1.5rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .message {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.9375rem;
      line-height: 1.45;
    }
    @media (prefers-reduced-motion: no-preference) {
      .message { animation: fadeIn 0.2s ease; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user {
      align-self: flex-end;
      background: var(--user-msg-bg);
      border: 1px solid rgba(0, 212, 255, 0.2);
    }
    .message.assistant {
      align-self: flex-start;
      background: var(--assistant-msg-bg);
      border: 1px solid rgba(201, 162, 39, 0.2);
    }
    .message .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    .message.assistant .label { color: var(--gold-dim); }
    .message.user .label { color: var(--arc-blue); }
    .message .content { word-break: break-word; }
    .message .attachments {
      margin-top: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .message .attachments img {
      max-width: 120px;
      max-height: 120px;
      border-radius: var(--radius-sm);
      object-fit: cover;
    }
    .message .attachments .file-name {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .input-row {
      flex-shrink: 0;
      padding: 1rem 1.5rem 1.5rem;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
    }
    .input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.5rem 0.75rem;
      min-height: 44px;
    }
    .input-wrap:focus-within {
      border-color: var(--gold-dim);
      box-shadow: 0 0 0 2px rgba(201, 162, 39, 0.15);
    }
    .input-wrap textarea {
      flex: 1;
      border: none;
      background: none;
      color: var(--text);
      font: inherit;
      font-size: 0.9375rem;
      resize: none;
      min-height: 24px;
      max-height: 120px;
    }
    .input-wrap textarea::placeholder { color: var(--text-muted); }
    .input-wrap textarea:focus { outline: none; }
    .input-wrap textarea:focus-visible { outline: 2px solid var(--arc-blue); outline-offset: 2px; }

    .btn-icon {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background-color 0.15s;
    }
    .btn-icon:hover {
      color: var(--text);
      background-color: rgba(255,255,255,0.06);
    }
    .btn-icon:focus-visible { outline: 2px solid var(--arc-blue); outline-offset: 2px; }
    .btn-icon:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-icon.active { color: var(--arc-blue); }
    .btn-icon.active.recording { color: var(--red); }
    @media (prefers-reduced-motion: no-preference) {
      .btn-icon.active.recording { animation: pulse 1s ease infinite; }
    }
    @keyframes pulse {
      50% { opacity: 0.7; }
    }
    .btn-send {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--gold), #a67c00);
      color: #0d1117;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, box-shadow 0.15s;
    }
    .btn-send:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .btn-send:hover:not(:disabled) {
      box-shadow: 0 0 16px rgba(201, 162, 39, 0.4);
    }
    @media (prefers-reduced-motion: no-preference) {
      .btn-send:hover:not(:disabled) { transform: scale(1.02); }
    }
    .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

    #fileInput { display: none; }
  </style>
</head>
<body>
  <div class="chat-interface">
  <header class="header">
    <div class="logo" aria-hidden="true"></div>
    <h1>JARVIS</h1>
    <span class="status" id="status">Ready</span>
  </header>

  <main class="chat-container" id="chatContainer" role="log" aria-live="polite">
    <div class="message assistant">
      <div class="label">JARVIS</div>
      <div class="content">Good evening. I am JARVIS. You can type a message, use the microphone to speak, or attach a file. How may I assist you?</div>
    </div>
  </main>

  <div class="input-row">
    <button type="button" class="btn-icon" id="btnPaperclip" title="Attach file" aria-label="Attach file">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
    </button>
    <input type="file" id="fileInput" accept="image/*,.pdf" multiple tabindex="-1">
    <div class="input-wrap">
      <textarea id="textInput" placeholder="Type or speak..." rows="1" aria-label="Message"></textarea>
    </div>
    <button type="button" class="btn-send" id="btnSend" title="Send" aria-label="Send message">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
    <button type="button" class="btn-icon" id="btnMic" title="Click to start or stop voice" aria-label="Microphone — click to talk" aria-pressed="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
  </div>
  </div>

  <script>
    window.JARVIS_CONFIG = window.JARVIS_CONFIG || {};
    // Enable debug: ?debug=1 in URL, or set window.JARVIS_DEBUG = true
    if (/[?&]debug=1/.test(location.search) || /[?&]debug=true/.test(location.search)) {
      window.JARVIS_DEBUG = true;
    }
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
