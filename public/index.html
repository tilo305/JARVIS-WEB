<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS — Voice &amp; Chat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23C41E3A' opacity='0.3'/><circle cx='16' cy='16' r='10' fill='none' stroke='%23FFB800' stroke-width='2'/><circle cx='16' cy='16' r='4' fill='%23DC143C'/></svg>" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Modern UI v2.0 - Enhanced Iron Man Theme with Glassmorphism -->
  <style>
    :root {
      --bg-deep: #000000;
      --bg-panel: #0f0f15;
      --bg-input: #1a1a22;
      --border: #2a2a35;
      /* Iron Man Gold - Hot Rod Gold */
      --gold: #FFB800;
      --gold-bright: #FFD700;
      --gold-glow: #FFED4E;
      --gold-dim: #FF8C00;
      /* Iron Man Red - Hot Rod Red */
      --iron-red: #C41E3A;
      --iron-red-bright: #DC143C;
      --iron-red-glow: #FF1744;
      --iron-red-dim: #8B0000;
      /* Accent Colors */
      --red: #FF1744;
      --text: #F5F5F5;
      --text-muted: #B0B0B0;
      --user-msg-bg: rgba(196, 30, 58, 0.15);
      --assistant-msg-bg: rgba(255, 184, 0, 0.12);
      --radius: 20px;
      --radius-sm: 12px;
      /* Modern easing functions */
      --ease-out: cubic-bezier(0, 0, 0.58, 1);
      --ease-in-out: cubic-bezier(0.42, 0, 0.58, 1);
      --ease-material: cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { 
      box-sizing: border-box;
    }
    body {
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
      font-variant-numeric: oldstyle-nums;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      background: #000000;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(220, 20, 60, 0.3) 0%, transparent 60%),
        radial-gradient(circle at 80% 70%, rgba(255, 215, 0, 0.3) 0%, transparent 60%),
        radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.2) 0%, transparent 70%),
        linear-gradient(135deg, rgba(220, 20, 60, 0.15) 0%, rgba(255, 215, 0, 0.12) 50%, rgba(220, 20, 60, 0.1) 100%);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(220, 20, 60, 0.06) 2px, rgba(220, 20, 60, 0.06) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255, 215, 0, 0.06) 2px, rgba(255, 215, 0, 0.06) 4px),
        repeating-linear-gradient(45deg, transparent, transparent 1px, rgba(255, 215, 0, 0.04) 1px, rgba(255, 215, 0, 0.04) 2px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 30% 40%, rgba(220, 20, 60, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 60%, rgba(255, 215, 0, 0.07) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
      animation: backgroundPulse 8s ease-in-out infinite;
    }
    @keyframes backgroundPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.7; }
    }
    .chat-interface {
      width: 700px;
      height: 600px;
      display: flex;
      flex-direction: column;
      background: rgba(15, 15, 21, 0.7);
      background-image: 
        linear-gradient(135deg, rgba(220, 20, 60, 0.15) 0%, rgba(255, 215, 0, 0.12) 50%, rgba(220, 20, 60, 0.1) 100%),
        radial-gradient(circle at top left, rgba(220, 20, 60, 0.2) 0%, transparent 50%),
        radial-gradient(circle at bottom right, rgba(255, 215, 0, 0.18) 0%, transparent 50%);
      border: none;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 
        0 25px 70px rgba(0, 0, 0, 0.8),
        0 0 0 2px rgba(220, 20, 60, 0.3),
        0 0 80px rgba(220, 20, 60, 0.3),
        0 0 120px rgba(255, 215, 0, 0.2),
        0 0 100px rgba(220, 20, 60, 0.15),
        inset 0 2px 4px rgba(255, 255, 255, 0.12),
        inset 0 -2px 4px rgba(255, 215, 0, 0.15);
      backdrop-filter: blur(25px) saturate(200%);
      -webkit-backdrop-filter: blur(25px) saturate(200%);
      position: relative;
      z-index: 1;
    }
    .chat-interface::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      padding: 3px;
      background: rgba(255, 184, 0, 0.3);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: -1;
    }
    .chat-interface::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255, 184, 0, 0.3);
      pointer-events: none;
      box-shadow: 
        0 0 10px rgba(255, 184, 0, 0.2);
    }
    .header {
      flex-shrink: 0;
      padding: 1rem 1.5rem;
      border-bottom: 2px solid;
      border-image: linear-gradient(90deg, transparent, var(--iron-red), var(--gold), var(--iron-red-bright), var(--gold), var(--iron-red), transparent) 1;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(15, 15, 21, 0.6);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      position: relative;
      box-shadow: 
        0 4px 16px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 0 30px rgba(196, 30, 58, 0.2),
        0 0 20px rgba(255, 184, 0, 0.15);
      overflow: hidden;
      min-width: 0;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, 
        transparent, 
        var(--iron-red) 20%, 
        var(--gold) 40%, 
        var(--iron-red-bright) 50%, 
        var(--gold) 60%, 
        var(--iron-red) 80%, 
        transparent
      );
      box-shadow: 
        0 0 20px var(--iron-red), 
        0 0 35px var(--gold);
      animation: borderGlow 3s ease-in-out infinite;
    }
    @keyframes borderGlow {
      0%, 100% { 
        opacity: 0.8;
        box-shadow: 
          0 0 20px var(--iron-red), 
          0 0 35px var(--gold);
      }
      50% { 
        opacity: 1;
        box-shadow: 
          0 0 30px var(--iron-red), 
          0 0 50px var(--gold),
          0 0 40px var(--iron-red-bright);
      }
    }
    .header .logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--iron-red-bright), var(--gold-bright), var(--iron-red), var(--gold));
      box-shadow: 
        0 0 40px rgba(196, 30, 58, 0.9),
        0 0 80px rgba(196, 30, 58, 0.6),
        0 0 120px rgba(255, 184, 0, 0.5),
        0 0 100px rgba(255, 184, 0, 0.4),
        inset 0 0 30px rgba(255, 184, 0, 0.6),
        inset 0 0 50px rgba(196, 30, 58, 0.4);
      position: relative;
      transition: transform var(--ease-material) 300ms, box-shadow var(--ease-material) 300ms;
      border: 2px solid rgba(255, 184, 0, 0.5);
    }
    .header .logo::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--iron-red), var(--gold), var(--iron-red-bright), var(--gold), var(--iron-red));
      opacity: 0.5;
      animation: logoRotate 3s linear infinite;
      z-index: -1;
    }
    @keyframes logoRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .header .logo {
        animation: logoGlow 2s ease-in-out infinite;
      }
    }
    @keyframes logoGlow {
      0%, 100% { 
        box-shadow: 
          0 0 40px rgba(196, 30, 58, 0.9),
          0 0 80px rgba(196, 30, 58, 0.6),
          0 0 120px rgba(255, 184, 0, 0.5),
          0 0 100px rgba(255, 184, 0, 0.4),
          inset 0 0 30px rgba(255, 184, 0, 0.6);
        transform: scale(1);
      }
      50% { 
        box-shadow: 
          0 0 70px rgba(196, 30, 58, 1),
          0 0 140px rgba(196, 30, 58, 0.8),
          0 0 200px rgba(255, 184, 0, 0.7),
          0 0 160px rgba(255, 184, 0, 0.6),
          inset 0 0 40px rgba(255, 184, 0, 0.8),
          inset 0 0 25px rgba(196, 30, 58, 0.5);
        transform: scale(1.08);
      }
    }
    .header h1 {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      margin: 0;
      letter-spacing: 0.03em;
      font-feature-settings: 'liga', 'kern';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 30%, var(--iron-red) 50%, var(--gold) 70%, var(--gold-bright) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: 
        drop-shadow(0 0 20px rgba(255, 184, 0, 0.9)) 
        drop-shadow(0 0 30px rgba(196, 30, 58, 0.8));
      animation: textShimmer 2.5s ease-in-out infinite;
      text-transform: uppercase;
      position: relative;
    }
    .header h1::before {
      content: 'JARVIS';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--iron-red-bright) 0%, var(--iron-red) 30%, var(--gold) 50%, var(--iron-red) 70%, var(--gold-bright) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      animation: textShimmerAlt 2.5s ease-in-out infinite;
    }
    @keyframes textShimmer {
      0%, 100% { 
        filter: 
          drop-shadow(0 0 20px rgba(255, 184, 0, 0.9)) 
          drop-shadow(0 0 30px rgba(196, 30, 58, 0.8));
        background-position: 0% 50%;
      }
      50% { 
        filter: 
          drop-shadow(0 0 28px rgba(255, 184, 0, 1)) 
          drop-shadow(0 0 45px rgba(196, 30, 58, 1))
          drop-shadow(0 0 60px rgba(255, 184, 0, 0.6));
        background-position: 100% 50%;
      }
    }
    @keyframes textShimmerAlt {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.3; }
    }
    .header .status {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text-muted);
      margin-left: auto;
      padding: 0.25rem 0.75rem;
      border-radius: 6px;
      font-feature-settings: 'liga', 'kern';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: rgba(42, 52, 65, 0.6);
      border: 1px solid rgba(196, 30, 58, 0.3);
      transition: all var(--ease-material) 300ms;
      position: relative;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .header .status::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.6;
      margin-left: -14px;
      transition: opacity var(--ease-material) 300ms;
      box-shadow: 0 0 8px currentColor;
    }
    .header .status.listening { 
      color: var(--iron-red-bright);
      background: rgba(196, 30, 58, 0.2);
      border-color: var(--iron-red);
      box-shadow: 
        0 0 30px rgba(196, 30, 58, 0.6),
        0 0 60px rgba(196, 30, 58, 0.4),
        inset 0 0 15px rgba(196, 30, 58, 0.2);
    }
    .header .status.listening::before {
      opacity: 1;
      background: var(--iron-red-bright);
      box-shadow: 
        0 0 18px var(--iron-red),
        0 0 36px var(--iron-red),
        0 0 54px var(--iron-red);
      animation: statusPulse 1.2s var(--ease-in-out) infinite;
    }
    .header .status.speaking { 
      color: var(--gold-bright);
      background: rgba(255, 184, 0, 0.18);
      border-color: var(--gold);
      box-shadow: 
        0 0 25px rgba(255, 184, 0, 0.5),
        0 0 50px rgba(255, 184, 0, 0.3),
        0 0 30px rgba(196, 30, 58, 0.2),
        inset 0 0 12px rgba(255, 184, 0, 0.15);
    }
    .header .status.speaking::before {
      opacity: 1;
      background: var(--gold-bright);
      box-shadow: 
        0 0 15px var(--gold),
        0 0 30px var(--gold),
        0 0 45px var(--gold),
        0 0 20px var(--iron-red);
      animation: statusPulse 1.2s var(--ease-in-out) infinite;
    }
    .header .status.status-misfire { 
      color: var(--gold-dim);
      background: rgba(139, 115, 85, 0.1);
    }
    .header .status.error { 
      color: var(--red);
      background: rgba(230, 57, 70, 0.1);
      box-shadow: 0 0 12px rgba(230, 57, 70, 0.2);
    }
    .header .status.error::before {
      opacity: 1;
    }
    @keyframes statusPulse {
      0%, 100% { opacity: 0.6; transform: translateY(-50%) scale(1); }
      50% { opacity: 1; transform: translateY(-50%) scale(1.2); }
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      margin-left: 0.5rem;
    }
    .header-actions .btn-icon {
      width: 40px;
      height: 40px;
    }

    /* Wake Word Tracker Inline Styles (in header) */
    .wake-word-tracker-inline {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: 1rem;
      margin-right: 1rem;
      flex: 1;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
    }
    .wake-word-tracker-inline .tracker-status {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.375rem;
      background: rgba(42, 52, 65, 0.4);
      border: 1px solid rgba(196, 30, 58, 0.3);
      border-radius: var(--radius-sm);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .wake-word-tracker-inline .tracker-status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      box-shadow: 0 0 8px currentColor;
      transition: all var(--ease-material) 300ms;
      flex-shrink: 0;
    }
    .wake-word-tracker-inline .tracker-status-indicator.active {
      background: var(--gold-bright);
      box-shadow: 
        0 0 12px var(--gold),
        0 0 24px var(--gold);
      animation: statusPulse 1.2s var(--ease-in-out) infinite;
    }
    .wake-word-tracker-inline .tracker-status-indicator.error {
      background: var(--red);
      box-shadow: 
        0 0 12px var(--red),
        0 0 24px var(--red);
    }
    .wake-word-tracker-inline .tracker-status-indicator.waiting {
      background: var(--iron-red-bright);
      box-shadow: 
        0 0 12px var(--iron-red),
        0 0 24px var(--iron-red);
      animation: statusPulse 1.2s var(--ease-in-out) infinite;
    }
    .wake-word-tracker-inline #trackerStatusText {
      font-size: 0.625rem;
      color: var(--text);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100px;
    }
    .wake-word-tracker-inline .wake-word-last-error {
      font-size: 0.5625rem;
      color: var(--text-muted);
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.2;
    }
    .wake-word-tracker-inline .wake-word-last-error.has-error {
      color: var(--red);
    }
    .wake-word-tracker-inline .tracker-metrics {
      display: flex;
      gap: 0.375rem;
      flex-shrink: 0;
      align-items: center;
    }
    .wake-word-tracker-inline .metric-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.2rem 0.3rem;
      background: rgba(42, 52, 65, 0.4);
      border: 1px solid rgba(255, 184, 0, 0.2);
      border-radius: var(--radius-sm);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      min-width: 45px;
      flex-shrink: 0;
    }
    .wake-word-tracker-inline .metric-label {
      font-size: 0.5rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.0625rem;
      line-height: 1;
    }
    .wake-word-tracker-inline .metric-value {
      font-size: 0.6875rem;
      font-weight: 700;
      color: var(--gold-bright);
      text-shadow: 0 0 10px rgba(255, 184, 0, 0.5);
      line-height: 1;
    }
    .wake-word-tracker-inline .tracker-events {
      display: none; /* Hide events in header to save space */
    }
    .wake-word-tracker-inline .tracker-events-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.25rem;
      border-bottom: 1px solid rgba(255, 184, 0, 0.2);
    }
    .wake-word-tracker-inline .tracker-events-header span {
      font-size: 0.625rem;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .wake-word-tracker-inline .btn-clear-events {
      font-size: 0.5625rem;
      padding: 0.125rem 0.25rem;
      border: 1px solid rgba(255, 184, 0, 0.3);
      border-radius: 6px;
      background: rgba(42, 52, 65, 0.4);
      color: var(--gold);
      cursor: pointer;
      transition: all var(--ease-material) 200ms;
    }
    .wake-word-tracker-inline .btn-clear-events:hover {
      background: rgba(255, 184, 0, 0.2);
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(255, 184, 0, 0.3);
    }
    .wake-word-tracker-inline .tracker-events-list {
      max-height: 60px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .wake-word-tracker-inline .tracker-events-list::-webkit-scrollbar {
      width: 3px;
    }
    .wake-word-tracker-inline .tracker-events-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .wake-word-tracker-inline .tracker-events-list::-webkit-scrollbar-thumb {
      background: rgba(255, 184, 0, 0.3);
      border-radius: 2px;
    }
    .wake-word-tracker-inline .tracker-event {
      padding: 0.25rem 0.375rem;
      background: rgba(196, 30, 58, 0.15);
      border: 1px solid rgba(196, 30, 58, 0.3);
      border-radius: var(--radius-sm);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 0.125rem;
      animation: fadeIn 300ms var(--ease-out);
    }
    .wake-word-tracker-inline .tracker-event-time {
      font-size: 0.5rem;
      color: var(--text-muted);
      font-family: 'Courier New', monospace;
    }
    .wake-word-tracker-inline .tracker-event-details {
      font-size: 0.625rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    .wake-word-tracker-inline .tracker-event-keyword {
      font-weight: 600;
      color: var(--gold-bright);
      text-shadow: 0 0 8px rgba(255, 184, 0, 0.5);
    }
    .wake-word-tracker-inline .tracker-event-latency {
      font-size: 0.5625rem;
      color: var(--text-muted);
      margin-left: auto;
    }
    .wake-word-tracker-inline .tracker-empty {
      padding: 0.25rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.625rem;
      font-style: italic;
    }
    @media (max-width: 768px) {
      .wake-word-tracker-inline {
        display: none; /* Hide on mobile to save space */
      }
    }

    .chat-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 1rem 1.5rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      scroll-behavior: smooth;
    }
    .chat-container::-webkit-scrollbar {
      width: 6px;
    }
    .chat-container::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-container::-webkit-scrollbar-thumb {
      background: rgba(139, 115, 85, 0.3);
      border-radius: 3px;
      transition: background var(--ease-material) 200ms;
    }
    .chat-container::-webkit-scrollbar-thumb:hover {
      background: rgba(201, 162, 39, 0.5);
    }
    .message {
      max-width: 85%;

<body>
  <div class="chat-interface">
  <header class="header">
    <div class="logo" aria-hidden="true"></div>
    <h1>JARVIS</h1>

          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>

  <script>
    // Console error + warning capture: always capture and show Copy log button so you can copy all console errors and warnings
    (function() {
      const maxEntries = 200;
      const captured = [];
      window.__JARVIS_CAPTURED_ERRORS = captured; // legacy name; array holds both errors and warnings
      function addEntry(type, message, stack) {
        var d = new Date();
        var time = d.toLocaleTimeString() + '.' + String(d.getMilliseconds()).padStart(3, '0');
        captured.push({ time: time, type: type, message: message, stack: stack || '' });
        if (captured.length > maxEntries) captured.shift();
      }
      function argsToMessageAndStack(args) {
        var msgParts = [];
        var stack = '';
        for (var i = 0; i < args.length; i++) {
          var a = args[i];
          if (a != null && typeof a === 'object') {
            // Check if it's an Error-like object (has stack, name, or message)
            var hasStack = typeof a.stack === 'string' && a.stack.length > 0;
            var hasName = typeof a.name === 'string' && a.name.length > 0;
            var hasMessage = typeof a.message === 'string' && a.message.length > 0;
            var isErrorLike = hasStack || (hasName && hasMessage) || (a instanceof Error);
            
            if (isErrorLike) {
              // Capture stack trace if available
              if (hasStack) {
                stack = a.stack;
              }
              
              // Build comprehensive error message with all available properties
              var errorParts = [];
              if (hasName) {
                errorParts.push(a.name);
              }
              if (hasMessage) {
                errorParts.push(a.message);
              }
