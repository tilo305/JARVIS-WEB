<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greeting Time of Day - Live Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    .test-section {
      background: #2a2a2a;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
      border: 1px solid #444;
    }
    .test-result {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
    }
    .pass {
      background: #1a4a1a;
      border-left: 4px solid #4caf50;
    }
    .fail {
      background: #4a1a1a;
      border-left: 4px solid #f44336;
    }
    .info {
      background: #1a3a4a;
      border-left: 4px solid #2196f3;
    }
    h1, h2 {
      color: #fff;
    }
    code {
      background: #1a1a1a;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
    }
    button {
      background: #4caf50;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
    }
    button:hover {
      background: #45a049;
    }
    #testGreeting {
      font-size: 18px;
      padding: 15px;
      background: #1a1a1a;
      border-radius: 4px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>Greeting Time of Day - Live Test</h1>

  <div class="test-section">
    <h2>Current Implementation Test</h2>
    <div id="testGreeting">Good {{ now }}, sir. How may I assist you?</div>
    <button type="button" onclick="testGreeting()">Test Greeting Replacement</button>
    <div id="testResults"></div>
  </div>

  <div class="test-section">
    <h2>Time of Day Logic Test</h2>
    <button type="button" onclick="testAllHours()">Test All 24 Hours</button>
    <div id="hourTestResults"></div>
  </div>

  <div class="test-section">
    <h2>Current Time Info</h2>
    <div id="currentTimeInfo"></div>
  </div>

  <script>
    // Copy of the implementation from index.html
    function getTimeOfDay(hour) {
      if (hour === undefined) {
        hour = new Date().getHours();
      }
      if (hour >= 5 && hour < 12) return 'morning';
      if (hour >= 12 && hour < 17) return 'afternoon';
      // Evening: 5:00 PM - 4:59 AM (hours 17-4)
      return 'evening';
    }

    function replaceTimePlaceholder(text, timeOfDay) {
      return text.replace('{{ now }}', timeOfDay);
    }

    function testGreeting() {
      const testGreetingEl = document.getElementById('testGreeting');
      const resultsEl = document.getElementById('testResults');
      resultsEl.innerHTML = '';

      // Get original text
      const originalText = 'Good {{ now }}, sir. How may I assist you?';
      
      // Test current time
      const currentHour = new Date().getHours();
      const timeOfDay = getTimeOfDay();
      const replaced = replaceTimePlaceholder(originalText, timeOfDay);

      // Update the display
      testGreetingEl.textContent = replaced;

      // Create results
      const tests = [
        {
          name: 'Element exists',
          pass: testGreetingEl !== null,
          message: testGreetingEl ? 'Element found' : 'Element not found'
        },
        {
          name: 'Placeholder replaced',
          pass: !replaced.includes('{{ now }}'),
          message: replaced.includes('{{ now }}') ? 'Placeholder still present' : 'Placeholder successfully replaced'
        },
        {
          name: 'Time of day is valid',
          pass: ['morning', 'afternoon', 'evening'].includes(timeOfDay),
          message: `Time of day: ${timeOfDay} (hour: ${currentHour})`
        },
        {
          name: 'Greeting format correct',
          pass: /^Good (morning|afternoon|evening), sir\. How may I assist you\?$/.test(replaced),
          message: `Result: "${replaced}"`
        }
      ];

      tests.forEach(test => {
        const div = document.createElement('div');
        div.className = `test-result ${test.pass ? 'pass' : 'fail'}`;
        div.innerHTML = `<strong>${test.name}:</strong> ${test.pass ? '✓ PASS' : '✗ FAIL'} - ${test.message}`;
        resultsEl.appendChild(div);
      });

      // Summary
      const passed = tests.filter(t => t.pass).length;
      const total = tests.length;
      const summary = document.createElement('div');
      summary.className = `test-result ${passed === total ? 'pass' : 'fail'}`;
      summary.innerHTML = `<strong>Summary:</strong> ${passed}/${total} tests passed`;
      resultsEl.appendChild(summary);
    }

    function testAllHours() {
      const resultsEl = document.getElementById('hourTestResults');
      resultsEl.innerHTML = '';

      const originalText = 'Good {{ now }}, sir. How may I assist you?';
      const expectedRanges = {
        morning: [5, 6, 7, 8, 9, 10, 11],
        afternoon: [12, 13, 14, 15, 16],
        evening: [17, 18, 19, 20, 21, 22, 23, 0, 1, 2, 3, 4] // Evening: 5:00 PM - 4:59 AM
      };

      let allPassed = true;
      const results = [];

      for (let hour = 0; hour < 24; hour++) {
        const timeOfDay = getTimeOfDay(hour);
        const replaced = replaceTimePlaceholder(originalText, timeOfDay);
        const isValid = /^Good (morning|afternoon|evening), sir\. How may I assist you\?$/.test(replaced);
        
        // Check if it matches expected range
        let expectedTimeOfDay = null;
        for (const [period, hours] of Object.entries(expectedRanges)) {
          if (hours.includes(hour)) {
            expectedTimeOfDay = period;
            break;
          }
        }

        const pass = isValid && timeOfDay === expectedTimeOfDay;
        if (!pass) allPassed = false;

        results.push({
          hour,
          timeOfDay,
          expectedTimeOfDay,
          pass,
          replaced
        });
      }

      // Display results
      results.forEach(result => {
        const div = document.createElement('div');
        div.className = `test-result ${result.pass ? 'pass' : 'fail'}`;
        div.innerHTML = `<strong>Hour ${result.hour}:</strong> ${result.pass ? '✓' : '✗'} Got "${result.timeOfDay}", Expected "${result.expectedTimeOfDay}" - "${result.replaced}"`;
        resultsEl.appendChild(div);
      });

      const summary = document.createElement('div');
      summary.className = `test-result ${allPassed ? 'pass' : 'fail'}`;
      const passedCount = results.filter(r => r.pass).length;
      summary.innerHTML = `<strong>Summary:</strong> ${passedCount}/24 hours passed`;
      resultsEl.appendChild(summary);
    }

    function updateCurrentTimeInfo() {
      const infoEl = document.getElementById('currentTimeInfo');
      const now = new Date();
      const hour = now.getHours();
      const timeOfDay = getTimeOfDay();
      const timeString = now.toLocaleTimeString('en-US', { 
        hour12: true, 
        hour: 'numeric', 
        minute: '2-digit',
        second: '2-digit'
      });

      infoEl.innerHTML = `
        <div class="test-result info">
          <strong>Current Time:</strong> ${timeString}<br>
          <strong>Hour (24h):</strong> ${hour}<br>
          <strong>Time of Day:</strong> ${timeOfDay}<br>
          <strong>Expected Greeting:</strong> Good ${timeOfDay}, sir. How may I assist you?
        </div>
      `;
    }

    // Initialize
    updateCurrentTimeInfo();
    setInterval(updateCurrentTimeInfo, 1000);
    testGreeting(); // Run test on load
  </script>
</body>
</html>
